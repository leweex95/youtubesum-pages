name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Production updates automatically from the default branch. Feature previews
    # may be published only by explicitly dispatching this workflow from a
    # feature/* branch; they share the single public Pages URL with production.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feature/'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test request page and bridge
        run: |
          node --check app.js
          node --test tests/site.test.js
          npm --prefix worker test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site artifact
        run: |
          mkdir -p dist
          cp index.html how-it-works.html styles.css app.js dist/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
